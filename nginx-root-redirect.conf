# 301 `/` → `/pt/` (ROOT_LOCALE, x-default). Mercado principal: Brasil
# (decisão 24/09/2026). O inglês continua em /en/.
#
# No VPS, desde 24/09/2026 18:12 BRT, o server apex NÃO inclui este
# arquivo. /etc/nginx/sites-available/villaarapiuns.com.br tem o bloco
# inline `location = / { return 301 /pt/; }` no lugar do include.
# Backup: /root/backups/villaarapiuns.com.br.bak-20260924-181232.
# Medido nessa hora: GET / → 301 https://villaarapiuns.com.br/pt/.
# Depois do deploy deste snippet, dá para voltar ao include e tirar o
# bloco inline (um `location = /` só). Runbook: docs/redirect-raiz.md
#
# Caminho do include, quando voltar:
#   include /var/www/vilaarapiuns/nginx-root-redirect.conf;
# em /etc/nginx/sites-available/villaarapiuns.com.br
# (server_name villaarapiuns.com.br; root /var/www/vilaarapiuns).
# Accept-Language (`return 302 $idioma_raiz`) continua fora.
# Deploy copia este arquivo e não recarrega o nginx. Com o include ativo:
#   sudo nginx -t && sudo systemctl reload nginx

location = / {
    return 301 /pt/;
}
