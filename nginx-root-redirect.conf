# 301 `/` → `/en/` (x-default). Include ATIVO no VPS desde 2026-09-24
# (antes este arquivo era só download estático e `GET /` era 302).
# Caminho real: include /var/www/vilaarapiuns/nginx-root-redirect.conf;
# em /etc/nginx/sites-available/villaarapiuns.com.br
# (server_name villaarapiuns.com.br; root /var/www/vilaarapiuns).
# Accept-Language (`return 302 $idioma_raiz`) saiu de propósito.
# Deploy copia este arquivo e não recarrega o nginx. Se o include mudar:
#   sudo nginx -t && sudo systemctl reload nginx
# Runbook: docs/redirect-raiz.md

location = / {
    return 301 /en/;
}
