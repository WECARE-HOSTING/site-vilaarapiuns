# 301 `/` → `/en/` (x-default).
#
# Este arquivo, sozinho, não muda o que o nginx responde. No ar (2026-09-24)
# ele está no docroot e o nginx o entrega como arquivo estático
# (`GET /nginx-root-redirect.conf` → 200, application/octet-stream).
# `GET /` não lê este arquivo: responde 302 com a página interna do nginx
# ("302 Found", 154 bytes). Isso é `return 302` ou `rewrite … redirect;`
# — a flag `redirect` é 302; `permanent` é 301.
#
# Para valer, este bloco tem de ser incluído DENTRO do server { } que
# responde por villaarapiuns.com.br:443, no lugar da regra 302, e o nginx
# recarregado. Passo a passo: docs/redirect-raiz.md
#
#   include /home/USUARIO/public_html/nginx-root-redirect.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# USUARIO é a conta do docroot (a mesma de docs/deploy-formulario.md).
# O `root` desse server { } é o diretório que contém este arquivo.

location = / {
    return 301 /en/;
}
